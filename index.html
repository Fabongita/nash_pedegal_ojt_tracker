<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Francisco M. Pedrigal III | OJT Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <section class="profile-section">
            <img src="profile.jpg" alt="Profile" class="profile-pic">
            <div class="profile-info">
                <h1>Francisco M. Pedrigal III</h1>
                <p class="course">Bachelor of Science in Computer Engineering</p>
                <p class="section">Section: <strong>2-6</strong></p>
                <p class="company">Company: <strong>Xurpas, Inc.</strong></p>
                
                <div class="progress-container">
                    <div class="progress-header">
                        <span>Internship Progress</span>
                        <span>99.57 / 400 Hours</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" style="width: 24.89%;"></div>
                    </div>
                </div>
            </div>
        </section>

        <section class="documents-section">
            <h2>OJT Documents</h2>
            <div class="documents-grid">
                <a href="LOI.jpg" class="document-card"><span>Letter of Intent </span></a>
                <a href="LOE.jpg" class="document-card"><span>Letter of Endorsement </span></a>
                <a href="medcert.jpg" class="document-card"><span>Medical Certificate </span></a>
            </div>
        </section>
    </main>

    <div id="imageModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <img id="imageViewer" src="" alt="Document">
        </div>
    </div>

    <script>
        const modal = document.getElementById("imageModal");
        const viewer = document.getElementById("imageViewer");
        const closeBtn = document.querySelector(".close-btn");

        document.querySelectorAll(".document-card").forEach(card => {
            card.addEventListener("click", function(e) {
                e.preventDefault();
                viewer.src = this.getAttribute("href");
                modal.style.display = "flex";
            });
        });

        closeBtn.onclick = () => { modal.style.display = "none"; };
        window.onclick = (e) => { if (e.target == modal) modal.style.display = "none"; };
    </script>
</body>
</html>
